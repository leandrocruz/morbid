name = "Morbid Admin API"

shared = "/opt/morbid/service/shared"

http {
  port = 9100
}

morbid {
  url         = "http://morbid:9000"
  url         = ${?MORBID_URL}
  application = "presto"
  application = ${?MORBID_APPLICATION}
}

cookie {
  name   = "morbid-admin-token"
  secure = false
  secure = ${?COOKIE_SECURE}
  domain = ${?COOKIE_DOMAIN}
}

cors {
  origins = ["http://localhost:5173"]
  origins = ${?CORS_ORIGINS}
}
